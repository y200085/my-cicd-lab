spring.datasource.url=jdbc:mysql://${DB_HOST:mysql}:3306/${DB_NAME:labdb}?useSSL=false&serverTimezone=UTC
spring.datasource.username=${DB_USER:labuser}
spring.datasource.password=${DB_PASSWORD:labpassword}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
server.port=8090