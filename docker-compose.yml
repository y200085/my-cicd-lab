services:
  mysql:
    image: mysql:8.0
    container_name: mysql-lab
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - lab-net

  app:
    build: ./app
    container_name: spring-app-lab
    ports:
      - "8090:8090"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/labdb?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=labuser
      - SPRING_DATASOURCE_PASSWORD=labpassword
      - SERVER_PORT=8090
    depends_on:
      - mysql
    networks:
      - lab-net

volumes:
  mysql_data:
  jenkins_home:

networks:
  lab-net:
    driver: bridge